<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Supernova Game · Agustina Espinoza</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#1b0f26;color:#ffe3f3;font-family:Arial,sans-serif;text-align:center}main{max-width:980px;margin:auto;padding:18px 12px}h1{font-size:24px;letter-spacing:4px;color:#ffc5e5;margin:8px 0 12px}#game{width:100%;max-width:900px;margin:auto}canvas{display:block;width:100%!important;height:auto!important;border:1px solid #76516f;border-radius:12px;touch-action:none}p{font-size:14px;color:#e6bed8}button{background:#f3b3d6;color:#28132f;border:0;border-radius:9px;padding:13px 24px;font-weight:bold;margin:6px;cursor:pointer}a{color:#f9b5df}
  </style>
</head>
<body>
<main>
  <h1>SUPERNOVA GAME</h1>
  <div id="game"></div>
  <p>← → o A / D: mover nave · ESPACIO: disparar / reiniciar · También puedes mover con el mouse o dedo.</p>
  <button id="shoot" type="button">DISPARAR / REINICIAR</button>
  <p>Agustina Espinoza · Taller de Interfaces</p>
  <p><a href="https://github.com/aguespinozaa/juego-estrellas">Ver código original de Processing y Arduino</a></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
<script src="sketch.js"></script>

</html>
